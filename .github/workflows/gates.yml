# The order-math and app gates (tests/README.md) on every push and pull
# request, so a change never reaches main with a gate nobody ran. Branch
# protection on main requires this check before a pull request can merge
# (CLAUDE.md, Two maintainers).
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # ordermath_equivalence reads an older revision with git show
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # editor_link.test.js runs editor_link.py
      - run: node tests/run_all.js
      # The real SQL in Postgres (PGlite, the one npm package): every schema
      # file in order, every smoke test, then the newest file again, which
      # must change no row.
      - run: npm ci
      - run: node supabase/tests/run_pglite.mjs
      # supabase/backup_role.sql (the nightly backup's read-only login), run as a
      # non-superuser like Supabase's postgres.
      - run: node supabase/tests/backup_role_pglite.mjs
      # supabase/night_schedule.sql (the nightly close's schedule, Sheet retirement
      # step 2) with stand-ins for Vault, pg_net and pg_cron, and the morning's
      # shadow check (supabase/tests/night_shadow_check.sql).
      - run: node supabase/tests/night_schedule_pglite.mjs
